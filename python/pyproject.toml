[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "timescales"
dynamic = ["version"]
description = "Calendars and timeslices for modeling: nested time scales on nestedscales"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Oleg Lugovoy", email = "olugovoy@optimalsolution.dev" }]
dependencies = [
  "nestedscales",
  "pyarrow>=14",
  "numpy>=1.23",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
pandas = ["pandas>=2.2"]
test = ["pytest>=8"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/optimal2050/timescales"

[tool.hatch.version]
path = "src/timescales/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/timescales"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::nestedscales.NestedScalesWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Messages are ported verbatim from R sprintf() calls, so %-formatting stays.
ignore = ["UP031"]
