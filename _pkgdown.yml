# pkgdown builds ONLY the R reference, into `docs/r/`. The `docs/` root is the
# multi-language landing page (and, in a later phase, a Quarto site with
# language-agnostic `concepts/` beside `r/`, `python/` and `cpp/`).
url: https://optimal2050.github.io/timescales/r/
destination: docs/r

template:
  bootstrap: 5
  light-switch: true
  # Twin-site theming: the siblings share structure and typography and
  # differ by one hue -- timescales #31688E (viridis blue, time),
  # geoscales #1F9E89 (viridis teal-green, space).
  bslib:
    primary: "#31688E"
    link-color: "#31688E"

# Pinned rather than `auto`: with `auto`, the first released version silently
# switches pkgdown to devel mode and relocates the whole site into `r/dev/`.
development:
  mode: unreleased
  version_label: danger

# Convention: figures are built on a SOLID background -- transparent PNGs
# are illegible in the site's dark mode.
figures:
  bg: "white"

# Home sidebar without the "Developers" box (citation covers attribution);
# footer without "Developed by ..." (built_with only).
home:
  sidebar:
    structure: [links, license, community, citation, dev]

footer:
  structure:
    left: built_with
    right: blank
  components:
    blank: ""

navbar:
  bg: primary

reference:
  - title: "Calendars"
    desc: "Construct and inspect Calendar objects."
    contents:
      - Calendar
      - calendar_from_leaftable
      - calendar_build
      - prune_calendar
  - title: "Navigation and subsetting"
    desc: "Query the timeframe hierarchy and subset calendars."
    contents:
      - calendar_queries
      - calendar_family
      - calendar_navigate
      - calendar_share
      - filter_calendar
  - title: "Catalog and data"
    desc: "The built-in calendar designs and sample data."
    contents:
      - calendar_catalog
      - calendars
      - merra2_cities
  - title: "Tokens"
    desc: "Reusable label vocabularies for one timeframe."
    contents:
      - register_token
  - title: "Timeframes"
    desc: "The atomic units underneath every calendar."
    contents:
      - CORE_TIMEFRAMES
      - as_timeframe
  - title: "Conversions"
    desc: "Move data between datetimes and calendars, and between calendars."
    contents:
      - datetime_to_timeslice
      - expand_calendar
      - recast_calendar
      - recast
      - recast_to_timebase
      - calendar_map
      - register_calendar_map
      - get_calendar_map
      - list_calendar_maps
      - clear_calendar_maps
      - join_calendar
      - base_calendar
  - title: "Visualization"
    desc: "Draw calendar structures and data on calendars."
    contents:
      - calendar_layout
      - calendar_autoplot
      - calendar_plot
      - calendar_wall_plot
      - calendar_wall_layout
      - calendar_weekdays
      - geom_calendar
      - calendar_breaks
  - title: "Rules and registries"
    desc: "Aggregation and alignment semantics, and their registries."
    contents:
      - RECAST_RULES
      - ALIGNMENT_RULES
      - register_rule
      - get_rule
      - list_rules
      - clear_rules
      - register_conversion
  - title: "Deprecated"
    contents:
      - timescales-deprecated
  - title: "Package"
    contents:
      - timescales-package

# Old article URLs kept alive: weather-data merged into visualization,
# getting-started renamed to the package-named intro (2026-08).
redirects:
  - ["articles/weather-data.html", "articles/visualization.html"]
  - ["articles/getting-started.html", "articles/timescales.html"]

# The intro (vignettes/timescales.Rmd) surfaces as the top-level
# "Get started" navbar item; everything else sits DIRECTLY in the
# Articles dropdown (`navbar: ~` = no "More articles..." detour).
articles:
  - title: "Reference"
    navbar: ~
    contents:
      - concepts
      - data-structures
      - data-manipulation
      - calendars
      - visualization
