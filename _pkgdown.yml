# pkgdown builds ONLY the R reference, into `docs/r/`. The `docs/` root is the
# multi-language landing page (and, in a later phase, a Quarto site with
# language-agnostic `concepts/` beside `r/`, `python/` and `cpp/`).
url: https://optimal2050.github.io/timescales/r/
destination: docs/r

template:
  bootstrap: 5
  light-switch: true

# Pinned rather than `auto`: with `auto`, the first released version silently
# switches pkgdown to devel mode and relocates the whole site into `r/dev/`.
development:
  mode: unreleased
  version_label: danger

reference:
  - title: "Calendars"
    desc: "Construct and inspect Calendar objects."
    contents:
      - Calendar
      - calendar_from_leaves
      - calendar_build
      - calendar_at_level
  - title: "Catalog and data"
    desc: "The built-in calendar designs and sample data."
    contents:
      - calendar_catalog
      - calendars
      - merra2_cities
  - title: "Tokens"
    desc: "Reusable label vocabularies for one timeframe."
    contents:
      - register_token
  - title: "Timeframes"
    desc: "The atomic units underneath every calendar."
    contents:
      - CORE_TIMEFRAMES
      - as_timeframe
  - title: "Conversions"
    desc: "Move data between datetimes and calendars, and between calendars."
    contents:
      - instant_to_slice
      - expand_calendar
      - calendar_recast
      - recast
      - calendar_join
      - base_calendar
  - title: "Visualization"
    desc: "Draw calendar structures and data on calendars."
    contents:
      - calendar_layout
      - calendar_autoplot
      - calendar_plot
      - geom_calendar
  - title: "Rules and registries"
    desc: "Aggregation and alignment semantics, and their registries."
    contents:
      - RECAST_RULES
      - ALIGNMENT_RULES
      - register_rule
      - get_rule
      - list_rules
      - clear_rules
      - register_conversion
  - title: "Package"
    contents:
      - timescales-package

articles:
  - title: "Get started"
    navbar: ~
    contents:
      - getting-started
  - title: "Reference"
    contents:
      - concepts
      - data-structures
      - calendars
      - weather-data
